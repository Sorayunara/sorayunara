    <text x="325" y="225"><tspan fill="#9cdcfe">    id</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#4ec9b0">Int</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#9cdcfe">dimension</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#4ec9b0">Int</tspan></text>

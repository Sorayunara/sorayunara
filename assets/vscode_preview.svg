    <!-- Line 12 -->
    <text x="325" y="400"><tspan fill="#569cd6">    let</tspan><tspan fill="#9cdcfe"> ch</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#4ec9b0">Channel</tspan><tspan fill="#d4d4d4">&lt;</tspan><tspan fill="#4ec9b0">TensorMessage</tspan><tspan fill="#d4d4d4">&gt; = </tspan><tspan fill="#4ec9b0">channel</tspan><tspan fill="#d4d4d4">::</tspan><tspan fill="#dcdcaa">new</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#b5cea8">1024</tspan><tspan fill="#d4d4d4">)</tspan></text>
    <!-- Line 13 -->
    <text x="325" y="425"><tspan fill="#569cd6">    spawn async</tspan><tspan fill="#d4d4d4"> { </tspan><tspan fill="#dcdcaa">compute_kernel</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#4ec9b0">TensorMessage</tspan><tspan fill="#d4d4d4"> { id: </tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#d4d4d4">, dimension: </tspan><tspan fill="#b5cea8">4096</tspan><tspan fill="#d4d4d4"> }) }</tspan></text>

    <!-- Line 7 -->
    <text x="325" y="275"><tspan fill="#569cd6">async fn</tspan><tspan fill="#dcdcaa"> compute_kernel</tspan><tspan fill="#d4d4d4">(msg: </tspan><tspan fill="#4ec9b0">TensorMessage</tspan><tspan fill="#d4d4d4">) -> </tspan><tspan fill="#4ec9b0">Result</tspan><tspan fill="#d4d4d4">&lt;</tspan><tspan fill="#4ec9b0">String</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#4ec9b0">String</tspan><tspan fill="#d4d4d4">&gt; {</tspan></text>
    <!-- Line 8 -->
    <text x="325" y="300"><tspan fill="#dcdcaa">    print</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#ce9178">"Kernel #"</tspan><tspan fill="#d4d4d4"> + msg.id.</tspan><tspan fill="#dcdcaa">to_string</tspan><tspan fill="#d4d4d4">() + </tspan><tspan fill="#ce9178">" active."</tspan><tspan fill="#d4d4d4">)</tspan></text>
    <!-- Line 9 -->
    <text x="325" y="325"><tspan fill="#c586c0">    return</tspan><tspan fill="#4ec9b0"> Result</tspan><tspan fill="#d4d4d4">::</tspan><tspan fill="#4ec9b0">Ok</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#ce9178">"Done"</tspan><tspan fill="#d4d4d4">)</tspan></text>
    <!-- Line 10 -->
    <text x="325" y="350"><tspan fill="#d4d4d4">}</tspan></text>
    <!-- Line 11 -->

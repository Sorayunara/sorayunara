<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="20" y="20" width="880" height="500" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title Bar -->
  <rect x="20" y="20" width="880" height="42" rx="14" fill="#0f172a"/>
  <rect x="20" y="50" width="880" height="12" fill="#0f172a"/>
  <line x1="20" y1="62" x2="900" y2="62" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="46" cy="41" r="6" fill="#ef4444"/>
  <circle cx="66" cy="41" r="6" fill="#f59e0b"/>
  <circle cx="86" cy="41" r="6" fill="#10b981"/>

  <!-- Title Text -->
  <text x="460" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle">sorayunara — zsh — 880x500</text>

  <!-- Terminal Content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="13.5" xml:space="preserve">
    <!-- Command 1 -->
    <text x="45" y="100" fill="#a855f7" font-weight="bold">❯ </text>
    <text x="65" y="100" fill="#38bdf8" font-weight="600">sorayunara </text>
    <text x="165" y="100" fill="#f8fafc">run examples/matrix.sora</text>

    <!-- Command 1 Output -->
    <text x="45" y="130" fill="#c084fc">🌌 Welcome to Sorayunara (.sora) High-Performance Runtime!</text>
    <text x="45" y="155" fill="#64748b">[INFO] Compiling AST -> Three-Address Code Quad IR ...</text>
    <text x="45" y="178" fill="#10b981">✓ Verified Hindley-Milner Type Inference &amp; Flow Borrow Checker</text>
    
    <text x="45" y="208" fill="#e2e8f0">Matrix A (2x2):</text>
    <text x="45" y="228" fill="#38bdf8">  |  1   2  |</text>
    <text x="45" y="248" fill="#38bdf8">  |  3   4  |</text>
    
    <text x="45" y="278" fill="#e2e8f0">Matrix Product (A × B):</text>
    <text x="45" y="298" fill="#a78bfa">  | 19  22  |</text>
    <text x="45" y="318" fill="#a78bfa">  | 43  50  |</text>
    <text x="45" y="342" fill="#10b981">Determinant: -2  [Execution time: 0.42ms · Zero memory leaks]</text>

    <!-- Command 2 -->
    <text x="45" y="390" fill="#a855f7" font-weight="bold">❯ </text>
    <text x="65" y="390" fill="#38bdf8" font-weight="600">sorayunara </text>
    <text x="165" y="390" fill="#f8fafc">doctor</text>

    <!-- Command 2 Output -->
    <text x="45" y="420" fill="#10b981">✓ LLVM 18 Backend Engine: Ready</text>
    <text x="45" y="442" fill="#10b981">✓ WebAssembly Clang/Wasm Target: Available</text>
    <text x="45" y="464" fill="#10b981">✓ 37 Standard Library Modules (std/*.sora): 100% Operational</text>
    <text x="45" y="486" fill="#38bdf8">🌌 All toolchain systems operational. Ready to build.</text>
  </g>
</svg>

name: Publish .sora Package to GitHub Packages

on:
  push:
    tags:
      - 'pkg-v*.*.*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Nama paket .sora yang akan dipublikasikan'
        required: true
        default: 'sora-math'
      version:
        description: 'Versi paket (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish .sora Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Sorayunara Compiler & CLI
        run: cargo build --release

      - name: Test .sora Library Package
        run: |
          ./target/release/sorayunara run templates/library/tests/lib_test.sora

      - name: Bundle & Package .sora Tarball
        id: pack
        run: |
          PKG_NAME="${{ github.event.inputs.package_name || 'sora-math' }}"
          PKG_VER="${{ github.event.inputs.version || '0.1.0' }}"
          ARCHIVE_NAME="${PKG_NAME}-${PKG_VER}.sorapkg.tar.gz"
          
          mkdir -p dist
          tar -czvf "dist/${ARCHIVE_NAME}" -C templates/library .
          
          # Generate SHA-256 Checksum
          cd dist
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "checksum=$(cat ${ARCHIVE_NAME}.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          cd ..

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS for OCI Artifacts Distribution
        run: |
          curl -LO "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz"
          tar -zxf oras_1.2.0_linux_amd64.tar.gz -C /usr/local/bin oras
          rm -f oras_1.2.0_linux_amd64.tar.gz

      - name: Publish .sora Package as OCI Artifact to GitHub Packages (GHCR)
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PKG_NAME="${{ github.event.inputs.package_name || 'sora-math' }}"
          PKG_VER="${{ github.event.inputs.version || '0.1.0' }}"
          
          cd dist
          oras push "ghcr.io/${REPO_OWNER}/packages/${PKG_NAME}:${PKG_VER}" \
            --artifact-type application/vnd.sorayunara.package.v1 \
            "${{ steps.pack.outputs.archive_name }}:application/gzip" \
            "${{ steps.pack.outputs.archive_name }}.sha256:text/plain"

      - name: Upload Package Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.sorapkg.tar.gz
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

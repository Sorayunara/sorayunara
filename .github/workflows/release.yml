name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: sorayunara
            archive_ext: tar.gz
            use_qemu: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: sorayunara
            archive_ext: tar.gz
            use_qemu: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: sorayunara.exe
            archive_ext: zip
            use_qemu: false
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: sorayunara
            archive_ext: tar.gz
            use_qemu: false
          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: sorayunara
            archive_ext: tar.gz
            use_qemu: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ARM64 Cross Linker & QEMU
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Target Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: End-to-End Compiler Smoke Test
        if: matrix.use_qemu == false
        shell: bash
        run: |
          BIN="$(pwd)/target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          echo "=== 1. Smoke Testing CLI Help & Version ==="
          "$BIN" --help
          echo "=== 2. Creating New Project ==="
          mkdir -p smoke_test_workspace
          cd smoke_test_workspace
          "$BIN" new canonical_hello
          cd canonical_hello
          echo "=== 3. Executing sora check ==="
          "$BIN" check
          echo "=== 4. Executing sora build ==="
          "$BIN" build
          echo "=== 5. Executing sora test ==="
          "$BIN" test
          echo "=== 6. Executing sora run ==="
          "$BIN" run
          echo "=== End-to-end smoke test passed successfully ==="

      - name: Package Archive
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME:-v0.1.1}
          PKG_NAME="sora-${VERSION}-${{ matrix.target }}"
          mkdir -p dist/"$PKG_NAME"
          
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/$PKG_NAME/"
          cp README.md LICENSE "dist/$PKG_NAME/" 2>/dev/null || true
          
          mkdir -p archives
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a "archives/${PKG_NAME}.zip" "./dist/${PKG_NAME}" || zip -r "archives/${PKG_NAME}.zip" "./dist/${PKG_NAME}"
          else
            tar -czvf "archives/${PKG_NAME}.tar.gz" -C dist "$PKG_NAME"
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: archives/*

  publish-release:
    name: Publish Release & Checksums
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Release Archives
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          echo "=== Generated SHA-256 Integrity Checksums ==="
          cat SHA256SUMS.txt

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*
          name: Sorayunara ${{ github.ref_name }} — Production-Ready Toolchain Distribution
          body: |
            ## 🌸 Sorayunara Release ${{ github.ref_name }}

            Official release of the **Sorayunara** systems & AI programming language toolchain.

            ### 📦 Multi-Platform Artifacts
            - **Linux (x86_64)**: `sora-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz`
            - **Linux (ARM64 / aarch64)**: `sora-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz`
            - **Windows (x86_64)**: `sora-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip`
            - **macOS (Apple Silicon M-series)**: `sora-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz`
            - **macOS (Intel x86_64)**: `sora-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz`

            ### 🔒 Integrity Verification
            Verify the integrity of downloaded binaries against `SHA256SUMS.txt`:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### 🚀 Quick Start
            ```bash
            # Create a new canonical project
            sora new hello
            cd hello
            sora run
            ```
          generate_release_notes: true
          draft: false
          prerelease: false

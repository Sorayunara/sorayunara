name: Sorayunara Compiler CI/CD Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  native-tests:
    name: ${{ matrix.os }} · Host
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify Code Formatting
        run: cargo fmt --check

      - name: Run Full Compiler & Verification Test Suite
        run: cargo test

  wasm-check:
    name: ubuntu-latest · wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check wasm32 compilation
        run: cargo check --target wasm32-unknown-unknown

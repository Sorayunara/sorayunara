name: Feature Request / RFC Proposal
description: Suggest an enhancement or propose a new feature for the Sorayunara language/toolchain.
title: "[Feature]: "
labels: ["enhancement", "rfc"]
body:
  - type: markdown
    attributes:
      value: Propose a new feature or design enhancement for Sorayunara.
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      placeholder: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Syntax
      placeholder: Describe the proposed syntax, semantics, or API.
    validations:
      required: true

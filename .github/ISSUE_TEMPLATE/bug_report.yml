name: 🐛 Bug Report
description: Report a bug or unintended behavior in the Sorayunara toolchain
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Sorayunara Version
      description: What version of the toolchain are you running? (Run `sorayunara --version`)
      placeholder: "sorayunara 0.1.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproducible Example (.sora code)
      description: Provide a minimal `.sora` code snippet that triggers the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
